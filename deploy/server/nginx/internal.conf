# __DOMAIN__ -- internal API listener (installed whether or not TLS exists yet).
# Internal entrance for the web app's server-side rendering: Next.js fetches the catalogue
# from here instead of going out through Cloudflare (which the origin lock would refuse).
server {
    listen 127.0.0.1:__API_INTERNAL_PORT__;
    server_name __DOMAIN__;
    root __BASE__/current/apps/api/public;
    access_log off;

    location ^~ /api/ {
        include snippets/erudsway-php.conf;
    }
    location / { return 404; }
}
