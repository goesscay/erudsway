# __DOMAIN__  --  Erudsway course marketplace
#   /                         -> Next.js (127.0.0.1:__WEB_PORT__, systemd: erudsway-web)
#   /api/, /sanctum/          -> Laravel (php-fpm pool "erudsway")
#   /storage/                 -> public uploads (course images)
#   /hls/{asset}/{segment}.ts -> encrypted video segments, signed (secure_link), no PHP
# Installed by deploy/server/bin/provision. Placeholders (__X__) are filled in there.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include snippets/ria-security-headers.conf;
    # Reject anything not proxied through Cloudflare (same origin lock as the other sites).
    if ($ria_from_cf = 0) { return 403; }

    root __BASE__/current/apps/api/public;
    # Video uploads arrive in 8 MB chunks; everything else is small.
    client_max_body_size 12m;
    access_log /var/log/nginx/erudsway.access.log;
    error_log  /var/log/nginx/erudsway.error.log warn;

    # --- API (Laravel) ---
    location ^~ /api/v1/auth/ {
        limit_req zone=erudsway_auth burst=10 nodelay;
        include snippets/erudsway-php.conf;
    }
    location ^~ /api/v1/instructor/uploads/ {
        limit_req zone=erudsway_upload burst=60 nodelay;
        include snippets/erudsway-php.conf;
    }
    location ^~ /api/ {
        limit_req zone=erudsway_api burst=120 nodelay;
        include snippets/erudsway-php.conf;
    }
    location ^~ /sanctum/ {
        limit_req zone=erudsway_api burst=60 nodelay;
        include snippets/erudsway-php.conf;
    }

    # --- Public uploads (course images) ---
    location ^~ /storage/ {
        alias __BASE__/shared/storage/app/public/;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        location ~ \.(php|phtml|html?|svg)$ { return 404; }
    }

    # --- Encrypted video segments ---
    # The API hands each viewer a playlist whose segment URLs carry ?md5=…&expires=…, signed
    # with MEDIA_SECURE_LINK_SECRET. Nginx checks the signature and serves the file directly.
    # Playlists and keys are never served from here; only *.ts segments and the poster match.
    location ~ "^/hls/(?<hls_asset>[0-9a-f-]{36})/(?<hls_file>[0-9]{3,4}p_[0-9]{4}\.ts|poster\.jpg)$" {
        include snippets/erudsway-hls-secret.conf;   # sets $erudsway_hls_secret (root-only file)
        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri $erudsway_hls_secret";

        if ($secure_link = "") { return 403; }   # bad or missing signature
        if ($secure_link = "0") { return 410; }  # expired: the player asks for a fresh playlist

        alias __BASE__/shared/storage/app/private/video-hls/$hls_asset/$hls_file;

        types { video/mp2t ts; image/jpeg jpg; }
        add_header Cache-Control "private, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        sendfile on;
        tcp_nopush on;
    }
    location /hls/ { return 404; }

    # --- Old Moodle addresses (bookmarks from before the switch) ---
    include snippets/erudsway-moodle-redirects.conf;

    # --- Web app (Next.js) ---
    location /_next/static/ {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location ~ /\.(?!well-known) { deny all; }
}
