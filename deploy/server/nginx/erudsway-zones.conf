# Rate-limit zones for the Erudsway site (separate from Moodle's ria_* and the simulator's sim_*).
# /etc/nginx/conf.d/erudsway-zones.conf. Laravel applies finer per-route limits on top.
limit_req_zone $binary_remote_addr zone=erudsway_api:10m    rate=600r/m;
limit_req_zone $binary_remote_addr zone=erudsway_auth:10m   rate=30r/m;
limit_req_zone $binary_remote_addr zone=erudsway_upload:10m rate=240r/m;
