# Old Moodle addresses (erudsway.com ran Moodle until 2026-10-22). Bookmarks, emails and
# search results still point at these; send them to the matching page of the new app.
# Included inside the main HTTPS server block of the live domain.

location = /login/index.php           { return 301 /login; }
location = /login/signup.php          { return 301 /register; }
location = /login/forgot_password.php { return 301 /forgot-password; }
location = /login/logout.php          { return 301 /; }
location = /index.php                 { return 301 /; }
location ~ ^/my(/.*)?$                { return 301 /my-learning; }
location = /course/index.php          { return 301 /courses; }
location = /course/search.php         { return 301 /courses?q=$arg_search; }
# The only real Moodle course (id 206) is now this course page; the rest were placeholders.
location = /course/view.php           { return 301 /course/gst-practical-mastery-registration-to-gstr-9c; }
location ~ ^/mod/                     { return 301 /my-learning; }
location ~ ^/user/(profile|edit|preferences)\.php$ { return 301 /account; }
location = /local/riakb/contribute.php { return 301 /teach; }
# Anything else Moodle served (pluginfile.php, theme/, lib/, admin/…) is gone.
location ~ \.php$                     { return 410; }
