; php-fpm pool for the Erudsway API. /etc/php/8.5/fpm/pool.d/erudsway.conf
[erudsway]
user = erudsway
group = erudsway
listen = /run/php/php8.5-fpm-erudsway.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 16
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000
request_terminate_timeout = 130s

; 8 MB video chunks plus form overhead.
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 12M
php_admin_value[memory_limit] = 256M
php_admin_value[expose_php] = Off
php_admin_value[error_log] = /var/log/erudsway/php-fpm.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
