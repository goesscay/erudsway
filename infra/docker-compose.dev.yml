# Local development services only. The apps themselves run natively
# (php artisan serve / pnpm dev). Start with:
#   docker compose -f infra/docker-compose.dev.yml up -d
name: erudsway-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: erudsway
      POSTGRES_USER: erudsway
      POSTGRES_PASSWORD: erudsway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erudsway"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  pgdata:
