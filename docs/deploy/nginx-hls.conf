# Erudsway — serving encrypted HLS segments straight from disk (PLAN §6, Phase 4).
#
# The API hands each viewer a playlist whose segment URLs look like
#   https://api.erudsway.com/hls/{asset-uuid}/720p_0001.ts?md5=…&expires=…
# signed with MEDIA_SECURE_LINK_SECRET. Nginx checks the signature and serves the file
# without involving PHP. Playlists and keys are never served from here: only *.ts
# segments and the poster image match, everything else under /hls/ is 404.
#
# Include this inside the API's `server { … }` block, and set the same secret in the
# API's .env:  MEDIA_SECURE_LINK_SECRET=<long random string>
# Keep the alias pointing at the Laravel private disk (storage/app/private).

location ~ "^/hls/(?<hls_asset>[0-9a-f-]{36})/(?<hls_file>[0-9]{3,4}p_[0-9]{4}\.ts|poster\.jpg)$" {
    secure_link $arg_md5,$arg_expires;
    secure_link_md5 "$secure_link_expires$uri CHANGE_ME_TO_MEDIA_SECURE_LINK_SECRET";

    if ($secure_link = "") { return 403; }   # bad or missing signature
    if ($secure_link = "0") { return 410; }  # expired: the player asks the API for a fresh playlist

    alias /var/www/erudsway/apps/api/storage/app/private/video-hls/$hls_asset/$hls_file;

    types { video/mp2t ts; image/jpeg jpg; }
    add_header Cache-Control "private, max-age=3600" always;
    add_header Access-Control-Allow-Origin "https://erudsway.com" always;
    add_header X-Content-Type-Options nosniff always;

    access_log off;
    sendfile on;
    tcp_nopush on;
}

location /hls/ {
    return 404;
}
